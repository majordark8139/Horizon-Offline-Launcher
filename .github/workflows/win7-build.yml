name: Build Horizon Windows 7 Edition

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - '.github/workflows/win7-build.yml'
      - 'tools/win7_launcher/**'
      - 'tools/win7_compat/**'

permissions:
  contents: write

jobs:
  prepare-assets:
    name: Prepare Minecraft 26.3 Assets (Linux Headless)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Java 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build Horizon Prepare Tool
        run: cargo build --release -p horizon-prepare --bin horizon-prepare

      - name: Download Minecraft 26.3 Jars and Libraries
        run: |
          mkdir -p mock_mc/versions/26.3 mock_mc/libraries dist_resources
          curl -sL -o mock_mc/versions/26.3/26.3.jar https://piston-data.mojang.com/v1/objects/e877b6a07acd633fb3bb475002175cec036e7b87/client.jar
          curl -sL -o server.jar https://piston-data.mojang.com/v1/objects/33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c/server.jar
          curl -sL -o mock_mc/versions/26.3/26.3.json https://piston-meta.mojang.com/v1/packages/11f1aefe473eefba0af62e3286c33b692807b2eb/26.3.json

          python3 - << 'EOF'
          import json, os, urllib.request

          with open("mock_mc/versions/26.3/26.3.json") as f:
              data = json.load(f)

          for lib in data.get("libraries", []):
              art = lib.get("downloads", {}).get("artifact")
              if art:
                  dest = os.path.join("mock_mc/libraries", art["path"])
                  os.makedirs(os.path.dirname(dest), exist_ok=True)
                  if not os.path.exists(dest):
                      urllib.request.urlretrieve(art["url"], dest)
          EOF

      - name: Extract and Generate Game Resources
        run: |
          ./target/release/horizon-prepare --prepare --minecraft-dir mock_mc --server-jar server.jar --output dist_resources

      - name: Pack Prepared Resources
        run: |
          cp mock_mc/versions/26.3/26.3.jar dist_resources/26.3.jar
          tar -czf prepared-resources.tar.gz -C dist_resources .

      - name: Upload Resources Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prepared-resources
          path: prepared-resources.tar.gz
          retention-days: 1

  build-win7:
    name: Build Windows 7 Portable Client
    runs-on: windows-latest
    needs: prepare-assets
    timeout-minutes: 120
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"
      HORIZON_TELEMETRY_URL: "off"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: win7-client-build

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile Windows 7 Compatibility Proxies
        shell: pwsh
        run: |
          cl.exe /O2 /LD /MT /W3 tools\win7_compat\combase.c /link /DEF:tools\win7_compat\combase.def /OUT:combase.dll kernel32.lib ole32.lib
          cl.exe /O2 /LD /MT /W3 tools\win7_compat\winrt_shim.c /link /DEF:tools\win7_compat\api-ms-win-core-winrt-l1-1-0.def /OUT:api-ms-win-core-winrt-l1-1-0.dll kernel32.lib ole32.lib
          if (-not (Test-Path combase.dll) -or -not (Test-Path api-ms-win-core-winrt-l1-1-0.dll)) {
            throw "Failed to compile Win7 compatibility DLLs"
          }
          dumpbin /exports combase.dll
          dumpbin /exports api-ms-win-core-winrt-l1-1-0.dll

      - name: Compile Windows 7 GUI Launcher
        shell: pwsh
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) {
            $csc = "C:\Windows\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          }
          & $csc /target:winexe /out:Horizon-Win7-Launcher.exe tools\win7_launcher\Win7Launcher.cs
          if (-not (Test-Path Horizon-Win7-Launcher.exe)) {
            throw "Failed to compile Horizon-Win7-Launcher.exe"
          }

      - name: Build Windows 7 Patched Client and Prepare Tool
        shell: pwsh
        run: |
          cargo build --release -p horizon-client --bin horizon-client -p horizon-prepare --bin horizon-prepare

      - name: Fetch Upstream Base Package (Assets & Shaders)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download nightly -R horizon-rust/horizon -p "horizon-windows-x64.zip"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path horizon-windows-x64.zip)) {
            Write-Warning "Upstream nightly fetch failed; downloading from gerdaroot releases..."
            gh release download nightly -R gerdaroot/Horizon-Offline-Launcher -p "horizon-windows-x64.zip"
          }
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path horizon-windows-x64.zip)) {
            throw "Failed to download horizon-windows-x64.zip from upstream or gerdaroot"
          }
          7z x horizon-windows-x64.zip -o"dist-win7"
          Remove-Item horizon-windows-x64.zip

      - name: Download Prepared Resources
        uses: actions/download-artifact@v4
        with:
          name: prepared-resources
          path: resources_download

      - name: Assemble Windows 7 Portable Package
        shell: pwsh
        run: |
          # Replace client and prepare executables with our Win7 patched builds
          $client = Get-ChildItem dist-win7 -Recurse -Filter "horizon-client.exe" | Select-Object -First 1
          if (-not $client) {
            throw "Could not locate horizon-client.exe in base package"
          }
          Copy-Item target\release\horizon-client.exe $client.FullName -Force

          $gameDir = $client.DirectoryName
          if (Test-Path target\release\horizon-prepare.exe) {
            Copy-Item target\release\horizon-prepare.exe $gameDir -Force
          }
          Copy-Item Horizon-Win7-Launcher.exe $gameDir -Force
          Copy-Item combase.dll $gameDir -Force
          Copy-Item api-ms-win-core-winrt-l1-1-0.dll $gameDir -Force
          Write-Host "=== Auditing horizon-client.exe IAT imports ==="
          dumpbin /imports (Join-Path $gameDir "horizon-client.exe") | Select-String -Pattern "^\s+\S+\.dll$|RoGet|CoIncrement|ProcessPrng|WaitOnAddress|Precise" -Context 0,1

          # Unpack and bundle pre-generated resources
          New-Item -ItemType Directory -Path "$gameDir\resources" -Force | Out-Null
          tar -xzf resources_download\prepared-resources.tar.gz -C "$gameDir\resources"
          Copy-Item "$gameDir\resources\*" "$gameDir" -Recurse -Force

          # Pre-seed conservative defaults for Haswell (HD 4400) / 4GB RAM
          @"
          renderDistance:6
          "@ | Set-Content (Join-Path $gameDir "options.txt")

          @"
          opengl
          renderDistance: 6
          lodDistance: 0
          hdr: false
          dynamicResolution: true
          fxaa: false
          taa: false
          workerThreads: 2
          "@ | Set-Content (Join-Path $gameDir "horizon-graphics.txt")

          # Create batch launch scripts
          @"
          @echo off
          title Horizon (OpenGL - Windows 7)
          echo Starting Horizon with Intel HD Graphics / Windows 7 optimizations...
          set WGPU_BACKEND=gl
          set WGPU_VALIDATION=0
          set WGPU_DEBUG=0
          set WGPU_DISCARD_HAL_LABELS=1
          set MIMALLOC_PURGE_DELAY=100
          set MIMALLOC_EAGER_COMMIT=0
          set HORIZON_TELEMETRY_URL=off
          horizon-client.exe --home . --resources .
          pause
          "@ | Set-Content (Join-Path $gameDir "Play-OpenGL.bat")

          @"
          @echo off
          title Horizon (Vulkan - Windows 7)
          echo Starting Horizon with Vulkan backend...
          set WGPU_BACKEND=vulkan
          set WGPU_VALIDATION=0
          set WGPU_DEBUG=0
          set WGPU_DISCARD_HAL_LABELS=1
          set MIMALLOC_PURGE_DELAY=100
          set MIMALLOC_EAGER_COMMIT=0
          set HORIZON_TELEMETRY_URL=off
          horizon-client.exe --home . --resources .
          pause
          "@ | Set-Content (Join-Path $gameDir "Play-Vulkan.bat")

          # Create distribution zip
          7z a -tzip Horizon-Windows7-Portable.zip "$gameDir\*"
          Get-Item Horizon-Windows7-Portable.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-Windows7-Portable
          path: Horizon-Windows7-Portable.zip
          retention-days: 14
